{{define "content"}}
<section class="auth">
  {{- with .Badge}}<span class="lockup">{{end}}
  <span class="wordmark display" role="img" aria-label="clippet">cli<span class="pp">pp</span>et</span>
  {{- with .Badge}}<span class="instance">{{.}}</span></span>{{end}}
  <!-- The bot's one-time login link (§20 erratum 341). A plain form, no script:
       loading this page changes nothing (Discord's crawler loads it too); the
       button's POST is what signs in, once. -->
  <form class="panel" data-signin action="{{.Action}}" method="post">
    <div class="panel-head"><h1>Sign in to {{.Host}} as {{.Name}}</h1></div>
    <input type="hidden" name="next" value="{{.Next}}">
    <div class="row">
      <span class="rl"></span>
      <span class="rc"><button type="submit" class="btn primary">Sign in</button></span>
      <span class="rs"></span>
    </div>
  </form>
</section>
{{end}}
