# image — the container images, published to the GitHub Container Registry for a release tag (v<YYYY.MM.DD[.N]>),
# or by hand for an existing tag.
#
#   ghcr.io/<owner>/<repo>:<version>, :latest, :sha-<commit12>   the CPU image, linux/amd64 + linux/arm64
#   ghcr.io/<owner>/<repo>:gpu-<version>, :gpu-latest            the opt-in NVENC flavour, linux/amd64 only
#
# <version> is the tag without its `v`, the same string the binary reports (DEPLOY.md §17.4). The Dockerfile's
# build stage cross-compiles, so the arm64 image does not compile Go under emulation; QEMU only runs the
# runtime stage's package install. Each image carries a build provenance attestation (mode=max) and an SBOM.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build (v<YYYY.MM.DD[.N]>)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The tag
        id: v
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eqx 'v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?' || { echo "::error::'$TAG' is not v<YYYY.MM.DD[.N]>"; exit 1; }
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.v.outputs.tag }}
          persist-credentials: false
      - name: The commit
        id: c
        shell: bash
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          { echo "sha=$sha"; echo "short=$(printf '%s' "$sha" | cut -c1-12)"; } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU (the arm64 runtime stage)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels (CPU)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.v.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.c.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ steps.c.outputs.sha }}
      - name: Build and push (CPU, amd64 + arm64)
        id: cpu
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.c.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-cpu
          cache-to: type=gha,scope=image-cpu,mode=max
      - name: Tags and labels (GPU)
        id: metagpu
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.v.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=gpu-${{ steps.v.outputs.version }}
            type=raw,value=gpu-latest
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ steps.c.outputs.sha }}
      - name: Build and push (GPU, amd64)
        id: gpu
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metagpu.outputs.tags }}
          labels: ${{ steps.metagpu.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.c.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-gpu
          cache-to: type=gha,scope=image-gpu,mode=max
      - name: The digests
        shell: bash
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          VERSION: ${{ steps.v.outputs.version }}
          CPU_DIGEST: ${{ steps.cpu.outputs.digest }}
          GPU_DIGEST: ${{ steps.gpu.outputs.digest }}
        run: |
          {
            echo "### Images for $VERSION"
            echo
            echo "- \`$IMAGE:$VERSION\` \`$CPU_DIGEST\` (linux/amd64, linux/arm64)"
            echo "- \`$IMAGE:gpu-$VERSION\` \`$GPU_DIGEST\` (linux/amd64)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE-DIGEST $CPU_DIGEST  $IMAGE:$VERSION"
          echo "IMAGE-DIGEST $GPU_DIGEST  $IMAGE:gpu-$VERSION"
