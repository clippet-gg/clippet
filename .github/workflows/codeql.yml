# codeql — GitHub's code scanning for the Go code, on pushes to main, pull requests and once a week.
# Results appear under the repository's Security tab.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (go)
    # Code scanning on a private repository needs GitHub Advanced Security; until the repository is public the
    # job is skipped rather than failed. A schedule event's payload carries no `repository`, so the weekly run
    # reads the repository variable PUBLIC instead, set to true when the visibility flips.
    if: ${{ github.event_name == 'schedule' && vars.PUBLIC == 'true' || github.event_name != 'schedule' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go (the version go.mod names)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:go
